
# Agent Configuration
# This file defines the models, their roles, capabilities, and loading arguments.

# Communication settings
communication:
  timeout: 30.0  # seconds
  max_retries: 3
  retry_delay: 1.0  # seconds

# Model settings
models:
  # ── Model setup ─────────────────────────────────────────────────────────────
  # With LM Studio selected as provider, models are loaded in LM Studio and
  # accessed via localhost:1234.  The path/device/dtype fields below only apply
  # when using direct HuggingFace loading (provider = "local" without LM Studio).
  #
  # Recommended split for 8 GB VRAM (RTX 2070):
  #   brain    → any ~9B reasoning model at Q4_K_M  (~5 GB VRAM)
  #   executor → any ~1B tool-call model at Q4_K_M  (~1 GB VRAM)
  # Select actual model names in the IRIS Settings → Configure → Models card.
  - id: "oracle"
    # Wave 3 (specs/phonon2-d1-model-swap T3.1/T3.2): the resident decision
    # backend is d1-3B on the shared llama-server (backend/agent/
    # decision_backend_d1.py; borrow-only — the server must already host the
    # d1 GGUF, the same server vision uses). The GLiNER ONNX directory below
    # is RETIRED from construction (its code + history stay until the T5.3
    # deletion; oracle.md §9 — no fallback model). `path` is accepted for
    # factory-signature compatibility and is unused by the d1 backend.
    path: null
    capabilities: ["tool_decision", "surface_choice", "narration_gate"]
    constraints:
      # REQ-25 makes this block LIVE (it was never parsed — grep "oracle"
      # returned zero hits, so every value here was decorative). Was 32, which
      # was never read.
      #
      # RAISED 6 -> 11 on 2026-10-09, measured live against data/memory.db. At 6
      # this reserved two slots for DELEGATE/NONE and passed only FOUR real
      # tools to the model, so 224 of 225 d1 tool_choice rows scored the SAME
      # six names and `write_file` — a PRIMARY tool in a coding agent — was
      # structurally unreachable; 53 rows (24%) recorded a reference the model
      # was never offered. 11 covers `_DEV_MENU_ORDER`'s nine tools plus the two
      # control labels.
      #
      # This value is the LIVE one (it overrides CANDIDATE_CAP_DEFAULT), so
      # changing it marks the calibrated threshold STALE and requires a curve
      # re-derivation before anything enforces on the new width (REQ-25
      # AC25.5). That is the correct outcome: the curve was derived at width 6
      # and says nothing about width 11. No consumer is enforced today, so
      # nothing flips — the stale marker is doing its job.
      # 11 -> 32 (2026-10-11): at 11 every browser tool fell off the menu
      # outside developer mode (registry order puts the file tools first) -
      # see decision_engine.CANDIDATE_CAP_DEFAULT.
      candidate_cap: 32
      acquire_timeout_s: 2.0
      # THRESHOLDS ARE KEYED BY BACKEND IDENTITY (REQ-25 AC25.8).
      # A probability threshold is only meaningful for the distribution it was
      # measured on: 0.85 is correct for LFM's sharpened softmax, 0.40 for GLiNER's
      # menu-wide softmax. Holding one global number across a model swap is how a
      # consumer ends up enforced on the wrong curve. The engine looks up the ACTIVE
      # backend here and REFUSES ENFORCEMENT when there is no entry (fail-closed) —
      # so a future model swap degrades to shadow rather than silently mis-enforcing.
      backend_thresholds:
        lfm2-350m-extract: 0.85           # retiring backend (REQ-21); historical rows only
        gliner25-decide-onnx-int8: 0.40   # retired backend (Wave 3); historical rows only
        # d1-3b-ad-q4_k_m (Wave 3): the ACTIVE identity has NO entry here.
        # Its curves live in benchmarks/oracle_calibration.json (written by
        # fit_oracle_calibration.py); threshold_for falls back to that file
        # and returns the fitted threshold on the RAW confidence scale. No
        # fitted curve for an identity is still the fail-closed state (None).
      # Per-consumer overrides sit ON TOP of the backend threshold (REQ-13).
      thresholds: {}
    optional: true   # decision paths degrade to the legacy heuristics if missing

  - id: "executor"
    path: "./models/LFM2.5-1.2B-Instruct"
    capabilities: ["tool_execution", "instruction_following"]
    constraints:
      device: "cpu"
      dtype: "float32"
    optional: true   # optional=true: startup continues if file is missing

  - id: "vision"
    # LFM2.5-VL runs via llama-server on port 8081, exposed as vision.* MCP tools in AgentToolBridge.
    # No path needed — VisionMCPServer is registered directly in tool_bridge._mcp_servers.
    # LAZY LOAD: does NOT start at backend startup. Activated by vision_enabled toggle in frontend.
    path: null
    capabilities: ["vision", "gui_interaction"]
    constraints:
      vision_server_url: "http://localhost:8081/v1"
      auto_load: false
    optional: true

  - id: "gguf_local"
    # GGUF brain models via llama-cpp-python server on port 8082 (OpenAI-compatible).
    # NEVER auto-loaded — only spawns when user selects a model in the Models Browser.
    # Managed by LocalModelManager in backend/agent/local_model_manager.py.
    path: null
    capabilities: ["conversation", "tool_execution", "reasoning"]
    constraints:
      inference_server_url: "http://127.0.0.1:8082/v1"
      auto_load: false
    optional: true

# Tool execution settings
tool_execution:
  max_concurrent: 5
  default_timeout: 30.0
  enable_security: true
