<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="Classical serialisation versus phase-spread concurrency">
  <title>Classical serialisation versus phase-spread concurrency</title>
  <desc>Left: a lock admits one operation at a time, the rest wait. Right: a phase dial lets several operations proceed at once because each holds a different position.</desc>

  <rect x="0" y="0" width="940" height="440" fill="#f7f8fa"/>

  <!-- titles -->
  <text x="235" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">Classical: one at a time</text>
  <text x="235" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#52606d">a lock, a budget, a timeout, a rate limit</text>

  <text x="705" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">Phase: many at once</text>
  <text x="705" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#52606d">each operation holds its own position</text>

  <!-- divider -->
  <line x1="470" y1="86" x2="470" y2="404" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- LEFT: serialised queue -->
  <rect x="70" y="100" width="330" height="52" rx="8" fill="#e4f5e9" stroke="#3e9b5f" stroke-width="2"/>
  <text x="90" y="131" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f4d33">Operation A</text>
  <text x="380" y="131" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2f7a4d">running</text>

  <rect x="70" y="164" width="330" height="52" rx="8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="2"/>
  <text x="90" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3e4c59">Operation B</text>
  <text x="380" y="195" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7b8794">waiting for the lock</text>

  <rect x="70" y="228" width="330" height="52" rx="8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="2"/>
  <text x="90" y="259" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3e4c59">Operation C</text>
  <text x="380" y="259" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7b8794">waiting for the lock</text>

  <rect x="70" y="292" width="330" height="52" rx="8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="2"/>
  <text x="90" y="323" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3e4c59">Operation D</text>
  <text x="380" y="323" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7b8794">waiting for the lock</text>

  <text x="235" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#52606d">The lock forbids overlap. Throughput is capped by the slowest step.</text>

  <!-- RIGHT: phase dial -->
  <circle cx="705" cy="248" r="118" fill="#ffffff" stroke="#cbd2d9" stroke-width="2"/>
  <circle cx="705" cy="248" r="84" fill="none" stroke="#e4e7eb" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- firing mark at pi (180 deg) -->
  <circle cx="705" cy="130" r="7" fill="#3e9b5f"/>
  <text x="705" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#3e9b5f">fire mark</text>

  <!-- hands at 4 different positions -->
  <line x1="705" y1="248" x2="705" y2="160" stroke="#2f7a4d" stroke-width="4" stroke-linecap="round"/>
  <line x1="705" y1="248" x2="789" y2="206" stroke="#2f7a4d" stroke-width="4" stroke-linecap="round"/>
  <line x1="705" y1="248" x2="789" y2="290" stroke="#2f7a4d" stroke-width="4" stroke-linecap="round"/>
  <line x1="705" y1="248" x2="705" y2="336" stroke="#2f7a4d" stroke-width="4" stroke-linecap="round"/>

  <circle cx="705" cy="160" r="7" fill="#3e9b5f"/>
  <circle cx="789" cy="206" r="7" fill="#3e9b5f"/>
  <circle cx="789" cy="290" r="7" fill="#3e9b5f"/>
  <circle cx="705" cy="336" r="7" fill="#3e9b5f"/>

  <circle cx="705" cy="248" r="6" fill="#1f2933"/>

  <text x="705" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#52606d">No two hands share a point, so all four proceed together.</text>
  <text x="705" y="402" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#52606d">A repulsion force keeps the hands apart.</text>

  <!-- caption -->
  <text x="470" y="428" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7b8794">The phase model does not limit how many may run. It gives each one a distinct position, so running together is safe.</text>
</svg>
