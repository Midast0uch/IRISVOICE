[pytest]
asyncio_mode = auto
testpaths = backend/tests tests/behavioral tests/contract tests/unit

# A hung test must FAIL, not stall the run. Nothing here is legitimately slow enough
# to need 120s of wall clock; behavioral tests that drive the real loop can block on a
# socket or a model server that is not up, and without this the whole suite sits until
# something external kills it.
timeout = 120
timeout_method = thread
